# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          cache-dependency-path: 'frontend'
      - run: pnpm i --prefix frontend
      - run: pnpm run build --if-present --prefix frontend
      
      - name: Upload
        uses: marcodallasanta/ssh-scp-deploy@v1.2.0
        with:
         host: ${{ secrets.SSH_HOST }} # "example.com"
         port: ${{ secrets.SSH_PORT }} # 22
         user: ${{ secrets.SSH_USER }} # "user"
         password: ${{ secrets.SSH_PASSWORD }} # "password"
         local: frontend/dist/*
         remote: "/home/laraue/frontend/pdfql"
         post_upload: echo "This will be executed after the upload!"
